[package]
name = "mini-oc-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[[bin]]
name = "mini-oc-web"
path = "src/main.rs"

[lib]
name = "mini_oc_web"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
mockito = "1"
wiremock = "0.6"
serial_test = "3"
