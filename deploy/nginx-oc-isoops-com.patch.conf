# ===========================================================================
# nginx patch for oc.isoops.com — unified-domain path-prefix dispatch
#
# Goal: replace the per-device subdomains (oc-mac.isoops.com, oc-win.isoops.com)
# with a single host (oc.isoops.com) where the first URL segment identifies
# the device. nginx strips that segment and forwards the rest to the matching
# rathole upstream.
#
# URL shape after this patch:
#   https://oc.isoops.com/                                  → SPA (BFF)
#   https://oc.isoops.com/healthz                           → BFF
#   https://oc.isoops.com/api/*                             → BFF
#   https://oc.isoops.com/{b64pc}/<base64dir>/session/<id>  → rathole-<device>
#
# How to apply this patch (don't blindly replace the whole nginx.conf):
#   1. cp nginx/nginx.conf nginx/nginx.conf.bak
#   2. Add the `map $device_id $rathole_backend` block to the `http {}` section.
#   3. Replace the existing `server { ... oc.isoops.com ... }` blocks (both 80
#      redirect and 443 ssl) with the versions below.
#   4. Remove the two server blocks for oc-mac.isoops.com and
#      oc-win.isoops.com (they're no longer used; rathole is reached only via
#      oc.isoops.com/{b64pc}/...).
#   5. nginx -t && nginx -s reload
# ===========================================================================

# ---------- ADD inside the existing `http { ... }` block ----------
# Map a base64url-encoded pcname to its rathole upstream name.
# Keep this list in sync with `devices.json` (pctype/pcname) — the pcname is
# what the SPA encodes as `{b64pc}` in the deep-link.
#
# To populate this safely: after editing devices.json on SB, regenerate the
# lines below by running `base64url(pcname) rathole_<key>` for every device.
# Example for office-Mac pcname="samuel":  c2FtdWVs → rathole_office_mac
map $device_id $rathole_backend {
    default     rathole_office_mac;   # fallback so unknown ids don't 502
    c2FtdWVs    rathole_office_mac;   # samuel  (Mac office)     → 12333
    WUctUEM     rathole_home_win;     # YG-PC   (Win home)       → 13333
    SG9tZS1QQw  rathole_home_win;     # Home-PC (Win home)       → 13333
    # ...add new lines here when registering a new device...
}

# ---------- REPLACE the existing 80-port oc.isoops.com server ----------
server {
    listen       80;
    server_name  oc.isoops.com;
    rewrite ^(.*)$ https://oc.isoops.com$request_uri;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------- REPLACE the existing 443-ssl oc.isoops.com server ----------
server {
    listen       443 ssl;
    server_name  oc.isoops.com;

    ssl_certificate     "/etc/nginx/certs/ssl_isoops.pem";
    ssl_certificate_key "/etc/nginx/certs/ssl_isoops.key";
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- BFF (SPA + API) ---
    location /api/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_pass http://mini_oc_web;
    }
    location = /healthz {
        proxy_pass http://mini_oc_web/healthz;
    }
    # Everything else without a device prefix → SPA (index.html fallback).
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_pass http://mini_oc_web;
    }

    # --- Device deep-links: /<b64pc>/<rest> → strip /<b64pc> → rathole ---
    # This is a NAMED location referenced from `location @device` so that
    # only paths with exactly one leading segment fall through here.
    location @device {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_pass http://$rathole_backend;
    }

    # Match exactly /<b64pc>/<rest...> (one segment then anything).
    # Anything else falls through to the SPA fallback above.
    location ~ ^/([^/]+)/.+$ {
        set $device_id $1;
        try_files $uri @device;
    }
}

# ===========================================================================
# REMOVE (or comment out) the following blocks — they're replaced by the
# path-prefix dispatch above:
#
#   server { listen 80;  server_name oc-mac.isoops.com;  ... }
#   server { listen 443; server_name oc-mac.isoops.com;  ... }
#   server { listen 80;  server_name oc-win.isoops.com;  ... }
#   server { listen 443; server_name oc-win.isoops.com;  ... }
#
# The rathole containers themselves stay as-is — they're still reachable on
# the docker network; nginx just no longer exposes them via subdomains.
# ===========================================================================